version: "3.9"

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - FLASK_ENV=production
    volumes:
      - db_data:/app/instance   # сохраняем SQLite между перезапусками
    restart: unless-stopped

volumes:
  db_data:
