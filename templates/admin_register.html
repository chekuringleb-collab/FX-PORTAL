{% extends "base.html" %}
{% block title %}Регистрация администратора — FX Portal{% endblock %}
{% block head %}
<style>
  body { display: flex; flex-direction: column; }
  .auth-wrap {
    flex: 1; display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 2rem;
    background: radial-gradient(ellipse 80% 60% at 50% -10%, rgba(248,113,113,0.1) 0%, transparent 70%);
  }
  .auth-box {
    width: 100%; max-width: 420px;
    background: var(--surface); border: 1px solid rgba(248,113,113,0.2);
    border-radius: 20px; padding: 2.5rem;
    animation: fadeUp 0.5s ease both;
  }
  .auth-title { font-family: var(--font-head); font-size: 1.5rem; font-weight: 800; text-align: center; margin-bottom: 0.3rem; }
  .auth-sub   { text-align: center; color: var(--muted); font-size: 0.85rem; margin-bottom: 2rem; }
  .auth-form  { display: flex; flex-direction: column; gap: 1.1rem; }
  .auth-form .input-group input { background: var(--surface2); }
  .hint { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
  .secret-badge {
    display: flex; align-items: center; gap: 8px; justify-content: center;
    padding: 8px 14px; border-radius: 8px;
    background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.2);
    color: var(--red); font-size: 0.8rem; font-weight: 500; margin-bottom: 1.5rem;
  }
</style>
{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-box">
    <h1 class="auth-title">⚙ Регистрация админа</h1>
    <div class="secret-badge">🔒 Защищённая страница</div>
    <p class="auth-sub">Создание аккаунта с правами администратора</p>
    <form class="auth-form" method="POST" action="/admin-register/{{ secret }}">
      <div class="input-group">
        <label for="username">Логин</label>
        <input type="text" id="username" name="username" placeholder="от 3 до 32 символов" autocomplete="username" required />
        <span class="hint">Буквы, цифры, _ и -</span>
      </div>
      <div class="input-group">
        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" placeholder="минимум 8 символов" autocomplete="new-password" required />
      </div>
      <div class="input-group">
        <label for="confirm_password">Подтверждение пароля</label>
        <input type="password" id="confirm_password" name="confirm_password" placeholder="повторите пароль" autocomplete="new-password" required />
      </div>
      <button type="submit" class="btn" style="background:var(--red);color:#fff;width:100%;justify-content:center;padding:12px;margin-top:4px;">
        Создать администратора →
      </button>
    </form>
  </div>
</div>
{% endblock %}
