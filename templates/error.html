{% extends "base.html" %}
{% block title %}{{ code }} — FX Portal{% endblock %}
{% block content %}
<div style="display:flex;align-items:center;justify-content:center;min-height:70vh;text-align:center;padding:2rem;">
  <div class="fade-up">
    <div style="font-family:var(--font-head);font-size:5rem;font-weight:800;color:var(--surface2);line-height:1;margin-bottom:1rem;">{{ code }}</div>
    <h1 style="font-family:var(--font-head);font-size:1.4rem;font-weight:700;margin-bottom:0.5rem;">{{ message }}</h1>
    <p style="color:var(--muted);margin-bottom:2rem;">Что-то пошло не так.</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary">← На главную</a>
  </div>
</div>
{% endblock %}
